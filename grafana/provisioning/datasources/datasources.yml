apiVersion: 1
deleteDatasources:
  - name: Mimir
    orgId: 1
datasources:
  - {name: Prometheus, type: prometheus, uid: prometheus, access: proxy, url: http://prometheus:9090, isDefault: false}
  - {name: VictoriaMetrics, type: prometheus, uid: victoriametrics, access: proxy, url: http://victoriametrics:8428, isDefault: true}
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - {name: TraceID, matcherRegex: 'trace_id.?[:=].?"?([a-f0-9]{32})', datasourceUid: tempo, url: '$${__value.raw}'}
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2: {datasourceUid: loki, filterByTraceID: true, filterBySpanID: false}
