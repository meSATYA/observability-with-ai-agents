<!doctype html><title>Local SRE Agent Lab</title><style>body{font:16px system-ui;max-width:820px;margin:48px auto}fieldset{margin:18px 0;padding:14px}label,button{margin:0 10px 10px 0;display:inline-block}button{padding:10px}pre{background:#111;color:#d5f5df;padding:16px;white-space:pre-wrap}</style><h1>Checkout incident simulator</h1><p>Select any combination of local failures, then investigate and optionally save the reviewed report to incident memory.</p><fieldset><legend>Failure simulations</legend><label><input type=checkbox value="frontend:frontend_overloaded"> Frontend overload</label><label><input type=checkbox value="gateway:gateway_rate_limited"> Gateway rate limit</label><label><input type=checkbox value="checkout:redis_timeout"> Checkout Redis timeout</label><label><input type=checkbox value="inventory:inventory_unavailable"> Inventory unavailable</label><label><input type=checkbox value="payment:db_pool"> Payment DB pool exhaustion</label><label><input type=checkbox value="payment:gateway_timeout"> Payment provider timeout</label><label><input type=checkbox value="payment:card_declined"> Payment card decline</label><br><button onclick="simulate()">Simulate selected failures</button><button onclick="clearFaults()">Clear all failures</button></fieldset><fieldset><legend>Ask the investigation workflow</legend><button onclick="investigate('Why is checkout failing?')">Why is checkout failing?</button><button onclick="investigate('Which services and dependencies are failing?')">Which dependencies are failing?</button><button onclick="investigate('Is this a timeout, capacity, or business-decline issue?')">Classify the failure</button><button onclick="investigate('What is the safest mitigation?')">What is the safest mitigation?</button><button onclick="investigate('Show the correlated metrics, logs, and traces.')">Show correlated evidence</button><button onclick="saveMemory()">Save reviewed report to memory</button></fieldset><pre id=o>Ready.</pre><script>const o=document.querySelector('#o');const api='http://localhost:8081';let lastReport=null;async function simulate(){const faults=[...document.querySelectorAll('input:checked')].map(x=>x.value);o.textContent='Generating incident telemetry…';const r=await fetch(api+'/api/failures',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({faults})});o.textContent=JSON.stringify(await r.json(),null,2)}async function clearFaults(){document.querySelectorAll('input:checked').forEach(x=>x.checked=false);await simulate()}async function investigate(question){o.textContent='Investigating…';const r=await fetch(api+'/api/investigations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({question})});lastReport=await r.json();o.textContent=JSON.stringify(lastReport,null,2)}async function saveMemory(){if(!lastReport||!lastReport.root_cause){o.textContent='Run an investigation first.';return}const r=await fetch(api+'/api/memory/incidents',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({approved:true,report:lastReport})});o.textContent=JSON.stringify(await r.json(),null,2)}</script>
