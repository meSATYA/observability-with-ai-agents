receivers:
  otlp:
    # Collector defaults changed to localhost-only; Docker peers need 0.0.0.0.
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch: {}
  resource:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
exporters:
  otlphttp/tempo: {endpoint: http://tempo:4318}
  otlphttp/loki: {endpoint: http://loki:3100/otlp}
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  # Emits received batch counts in collector logs; invaluable for local pipeline diagnosis.
  debug:
    verbosity: detailed
service:
  extensions: [health_check]
  pipelines:
    traces: {receivers: [otlp], processors: [resource, batch], exporters: [otlphttp/tempo, debug]}
    metrics: {receivers: [otlp], processors: [resource, batch], exporters: [prometheus, debug]}
    logs: {receivers: [otlp], processors: [resource, batch], exporters: [otlphttp/loki, debug]}
