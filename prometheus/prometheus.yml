global: {scrape_interval: 5s}
scrape_configs:
  - job_name: otel-collector
    static_configs: [{targets: [otel-collector:8889]}]
  - job_name: llama-cpp
    metrics_path: /metrics
    static_configs: [{targets: [llama-cpp:8080]}]
  - job_name: agent-api
    metrics_path: /metrics
    static_configs: [{targets: [agent-api:8081]}]
remote_write:
  - url: http://victoriametrics:8428/api/v1/write
    remote_timeout: 30s
